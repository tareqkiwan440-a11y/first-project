<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
 <!-- 1. Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Expense Tracker</span>
    <button id="themeToggle" class="btn btn-outline-light btn-sm">🌙 Dark</button>
  </div>
</nav>

  <div class="container">

    <!-- مكان رسائل الخطأ -->
    <div id="alertBox"></div>

    <!-- Spinner -->
    <div id="spinner" class="text-center my-3 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- 2. Summary cards -->
    <div class="row mb-4">
      <div class="col-md-4 mb-3 mb-md-0">
        <div class="card text-center">
          <div class="card-body">
            <h6 class="card-subtitle text-muted">Total Amount</h6>
            <h3 class="card-title" id="totalAmount">0.00</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3 mb-md-0">
        <div class="card text-center">
          <div class="card-body">
            <h6 class="card-subtitle text-muted">Number of Expenses</h6>
            <h3 class="card-title" id="expenseCount">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center">
          <div class="card-body">
            <h6 class="card-subtitle text-muted">Highest Expense</h6>
            <h3 class="card-title" id="highestAmount">0.00</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Form -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Add / Edit Expense</h5>
        <form id="expenseForm" class="row g-3">
          <input type="hidden" id="expenseId">

          <div class="col-md-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" required>
          </div>

          <div class="col-md-2">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" step="0.01" min="0" class="form-control" id="amount" required>
          </div>

          <div class="col-md-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" required>
              <option value="" selected disabled>Choose...</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="col-md-2">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" required>
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 4. Filter -->
    <div class="row mb-3">
      <div class="col-md-4">
        <label for="filterCategory" class="form-label">Filter by category</label>
        <select class="form-select" id="filterCategory">
          <option value="">All</option>
        </select>
      </div>
    </div>

    <!-- 5. Table (الصفوف تُبنى بالـ JavaScript) -->
    <div class="table-responsive mb-5">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expensesBody"></tbody>
      </table>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
